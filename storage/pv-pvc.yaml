---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /tmp/k8s-pv-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-pvc
spec:
  volumeName: local-pv
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-pvc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-pvc
  template:
    metadata:
      labels:
        app: data-exchange-pvc
    spec:
      containers:
        - name: writer
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                echo "$(date) - Writing data to PVC" > /shared/data.txt
                sleep 5
              done
          volumeMounts:
            - name: pvc-storage
              mountPath: /shared
        - name: reader
          image: wbitt/network-multitool
          command:
            - /bin/sh
            - -c
            - |
              tail -f /shared/data.txt
          volumeMounts:
            - name: pvc-storage
              mountPath: /shared
      volumes:
        - name: pvc-storage
          persistentVolumeClaim:
            claimName: local-pvc
